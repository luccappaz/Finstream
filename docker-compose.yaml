services:
  producer:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    container_name: producer
    working_dir: /app
    volumes:
      - ./producers:/app
    command:
      ["uv", "run", "--with", "confluent-kafka", "generate_transactions.py"]
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finstream-net

  broker:
    image: apache/kafka:4.3.1
    container_name: broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: hnO9dcJJSE-txs8831dhiQ
    networks:
      - finstream-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  jobmanager:
    container_name: jobmanager
    build:
      context: ./
      dockerfile: docker/flink/Dockerfile
    image: my_flink:2.2-java21
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./processors:/opt/flink/jobs
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        parallelism.default: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        rest.port: 8081
    networks:
      - finstream-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/config > /dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  sql-client:
    build:
      context: ./
      dockerfile: docker/flink/Dockerfile
    image: my_flink:2.2-java21
    container_name: flink-sql-client
    depends_on:
      jobmanager:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        rest.port: 8081
    volumes:
      - ./processors:/opt/flink/jobs
    networks:
      - finstream-net
    command: >
      /opt/flink/bin/sql-client.sh
      -f /opt/flink/jobs/fraud_detection.sql &&
      tail -f /dev/null
    tty: true
    stdin_open: true

  taskmanager:
    container_name: taskmanager
    build:
      context: ./
      dockerfile: docker/flink/Dockerfile
    image: my_flink:2.2-java21
    depends_on:
      - jobmanager
    command: taskmanager
    scale: 1
    volumes:
      - ./processors:/opt/flink/jobs
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        parallelism.default: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        rest.port: 8081
    networks:
      - finstream-net
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f taskmanager || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - finstream-net

  minio:
    image: minio/minio
    container_name: minio
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password
      - MINIO_DOMAIN=minio
    networks:
      finstream-net:
        aliases:
          - warehouse.minio
    ports:
      - 9001:9001 # Acessar pelo navegador
      - 9000:9000 # Access by API
    volumes:
      - ./minio_data:/data # local:container
    command: ["server", "/data", "--console-address", ":9001"]

  mc:
    depends_on:
      - minio
    image: minio/mc
    container_name: mc
    networks:
      - finstream-net
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    entrypoint: |
      /bin/sh -c "
      until (/usr/bin/mc alias set minio http://minio:9000 admin password) do echo '...waiting...' && sleep 1; done;
      if ! /usr/bin/mc ls minio/warehouse > /dev/null 2>&1; then
        /usr/bin/mc mb minio/warehouse;
        /usr/bin/mc policy set public minio/warehouse;
      fi;
      tail -f /dev/null
      "
networks:
  finstream-net:
    driver: bridge
